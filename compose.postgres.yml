name: garmin-coach-postgres

services:
  postgres:
    image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_DB: ${GARMIN_COACH_POSTGRES_DB:-coach}
      POSTGRES_USER: ${GARMIN_COACH_POSTGRES_ADMIN_USER:-coach_admin}
      POSTGRES_PASSWORD: ${GARMIN_COACH_POSTGRES_ADMIN_PASSWORD:?set GARMIN_COACH_POSTGRES_ADMIN_PASSWORD}
      GARMIN_COACH_POSTGRES_APP_USER: ${GARMIN_COACH_POSTGRES_APP_USER:-coach}
      GARMIN_COACH_POSTGRES_APP_PASSWORD: ${GARMIN_COACH_POSTGRES_APP_PASSWORD:?set GARMIN_COACH_POSTGRES_APP_PASSWORD}
    ports:
      - "127.0.0.1:${GARMIN_COACH_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-garmin-coach-roles.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - PGPASSWORD="$${GARMIN_COACH_POSTGRES_APP_PASSWORD}" psql --host 127.0.0.1 --username "$${GARMIN_COACH_POSTGRES_APP_USER}" --dbname "$${POSTGRES_DB}" --no-psqlrc --command 'SELECT 1' >/dev/null
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  postgres-data:
